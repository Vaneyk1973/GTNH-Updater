name: Build archives
on: workflow_dispatch
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - platform: windows
            python: '3.13.17'
            requirements: tools/build-requirements.txt
            flag: ''
            binary: dist/GTNH-Updater.exe
          - platform: win7
            python: '3.8.10'
            requirements: tools/build-requirements-win7.txt
            flag: '--legacy'
            binary: dist/GTNH-Updater-Win7.exe
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r ${{ matrix.requirements }}
      - run: tools\build-windows.cmd ${{ matrix.flag }}
        shell: cmd
      - run: |
          $env:GTNH_TEST_EXECUTABLE = (Resolve-Path '${{ matrix.binary }}').Path
          python -m unittest discover -s tests -p "test_*.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/package-release.py ${{ matrix.platform }} --binary ${{ matrix.binary }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.platform }}
          path: dist/release/*
          if-no-files-found: error
  linux:
    runs-on: ubuntu-24.04
    container: python:3.13.17-slim-bookworm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: apt-get update && apt-get install -y --no-install-recommends binutils default-jre-headless
      - run: python -m pip install -r tools/build-requirements-linux.txt
      - run: bash tools/build-linux.sh
      - run: GTNH_TEST_EXECUTABLE="$PWD/dist/gtnh-updater" python -m unittest discover -s tests -p 'test_*.py'
      - run: |
          python tools/package-release.py linux --binary dist/gtnh-updater
          python tools/package-release.py source
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-and-source
          path: dist/release/*
          if-no-files-found: error
